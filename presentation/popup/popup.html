<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WordCapture</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-top">
        <h1 class="logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
          </svg>
          WordCapture
        </h1>
        <button class="btn-icon" id="settingsBtn" title="Configuración">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
          </svg>
        </button>
      </div>
      <div class="tabs">
        <button class="tab active" data-tab="history">Historial</button>
        <button class="tab" data-tab="review">Repaso</button>
        <button class="tab" data-tab="stats">Estadísticas</button>
      </div>
    </header>

    <main class="main">
      <div class="tab-content active" id="historyTab">
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="Buscar palabra..." class="search-input">
          <select id="levelFilter" class="filter-select">
            <option value="">Todos los niveles</option>
            <option value="A1">A1</option>
            <option value="A2">A2</option>
            <option value="B1">B1</option>
            <option value="B2">B2</option>
            <option value="C1">C1</option>
            <option value="C2">C2</option>
          </select>
        </div>
        <div class="word-list" id="wordList">
          <div class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
            </svg>
            <p>Selecciona una palabra en cualquier página para guardarla</p>
          </div>
        </div>
      </div>

      <div class="tab-content" id="reviewTab">
        <div class="review-container" id="reviewContainer">
          <div class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
            <p>No hay palabras para repasar</p>
          </div>
        </div>
      </div>

      <div class="tab-content" id="statsTab">
        <div class="stats-container" id="statsContainer">
          <div class="stat-card">
            <span class="stat-value" id="totalWords">0</span>
            <span class="stat-label">Total palabras</span>
          </div>
          <div class="stat-card">
            <span class="stat-value" id="masteredWords">0</span>
            <span class="stat-label">Dominadas</span>
          </div>
          <div class="stat-card">
            <span class="stat-value" id="dueReview">0</span>
            <span class="stat-label">Para repasar</span>
          </div>
          <div class="stat-card">
            <span class="stat-value" id="masteryPercent">0%</span>
            <span class="stat-label">Progreso</span>
          </div>
          <div class="level-breakdown" id="levelBreakdown"></div>
        </div>
      </div>
    </main>
  </div>
  <script src="PopupController.js" type="module"></script>
</body>
</html>
